name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: sigdip_db
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
          extensions: mbstring, pdo_mysql, dom, gd, zip, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --env=testing
        env:
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1

      - name: Run PHPUnit tests
        run: php artisan test
        env:
          DB_PASSWORD: root
          DB_HOST: 127.0.0.1

  cypress-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cypress component tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: mobile_app
          component: true
          browser: chrome
          spec: |
            cypress/component/**/*.cy.js

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-mobile
          path: mobile_app/cypress/screenshots
          if-no-files-found: ignore

  cypress-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start Vite dev server
        run: npm run dev -- --host 0.0.0.0 --port 5173 &
        timeout: 10000

      - name: Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: mobile_app
          browser: chrome
          spec: |
            cypress/e2e/**/*.cy.js

      - name: Upload Cypress artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-e2e
          path: mobile_app/cypress/screenshots
          if-no-files-found: ignore
